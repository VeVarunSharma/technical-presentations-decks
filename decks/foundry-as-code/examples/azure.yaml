# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: repository-support

requiredVersions:
  azd: ">=1.27.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.8"
    azure.ai.projects: ">=1.0.0-beta.4"

services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: repository-model
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: "2026-03-17"
        sku:
          name: GlobalStandard
          capacity: 10

  github-conn:
    host: azure.ai.connection
    uses:
      - ai-project
    category: RemoteTool
    target: https://api.githubcopilot.com/mcp
    authType: CustomKeys
    credentials:
      Authorization: ${GITHUB_PAT}

  agent-tools:
    host: azure.ai.toolbox
    uses:
      - ai-project
      - github-conn
    description: Read-only tools for repository support.
    tools:
      - type: web_search
      - type: mcp
        connection: github-conn

  repository-agent:
    host: azure.ai.agent
    project: src/repository-agent
    language: docker
    uses:
      - ai-project
      - github-conn
      - agent-tools
    kind: hosted
    name: repository-agent
    description: Answers developer questions using repository evidence.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      MICROSOFT_FOUNDRY_MODEL_DEPLOYMENT_NAME: ${MICROSOFT_FOUNDRY_MODEL_DEPLOYMENT_NAME}
      TOOLBOX_NAME: agent-tools
    startupCommand: python main.py
    toolboxes:
      - agent-tools
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi

# Optional: eject Bicep or Terraform with azd ai agent init --infra[=terraform]
# when generated infrastructure is not sufficiently explicit or customizable.
